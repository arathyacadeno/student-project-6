{% extends "base.html" %}
{% block content %}
<div class="page-head"><h2>Book a trip</h2><p>We estimate the cost from the package or the destination's daily cost. An admin confirms your request.</p></div>
<form class="card" method="post" style="max-width:640px">{% csrf_token %}{{ form.non_field_errors }}
{% for f in form %}<div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}
<button type="submit">Request booking</button></form>
{% endblock %}
