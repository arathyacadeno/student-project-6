{% extends "manage/base.html" %}
{% block admin %}
<div class="page-head"><h2>{% if obj %}Edit{% else %}Add{% endif %} · {{ title }}</h2></div>
<form class="card" method="post" style="max-width:680px">{% csrf_token %}{{ form.non_field_errors }}
{% for f in form %}<div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{{ f.errors }}{% if f.help_text %}<span class="help">{{ f.help_text }}</span>{% endif %}</div>{% endfor %}
<div class="row"><button type="submit">Save</button><a class="btn ghost" href="{% url 'admin_list' key %}">Cancel</a></div></form>
{% endblock %}
