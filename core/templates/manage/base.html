{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="side admin-layout">
  <aside class="admin-sidebar-card">
    <nav class="admin-sidebar-nav" aria-label="Admin Navigation">
      <a href="{% url 'admin_dashboard' %}" class="sidebar-item {% if request.resolver_match.url_name == 'admin_dashboard' %}on{% endif %}">
        <svg viewBox="0 0 24 24" class="nav-ic" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Overview</span>
      </a>
      <a href="{% url 'admin_list' 'destinations' %}" class="sidebar-item {% if key == 'destinations' or '/destinations/' in request.path %}on{% endif %}">
        <svg viewBox="0 0 24 24" class="nav-ic" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span>Destinations</span>
      </a>
      <a href="{% url 'admin_list' 'categories' %}" class="sidebar-item {% if key == 'categories' or '/categories/' in request.path %}on{% endif %}">
        <svg viewBox="0 0 24 24" class="nav-ic" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
        <span>Categories</span>
      </a>
      <a href="{% url 'admin_list' 'packages' %}" class="sidebar-item {% if key == 'packages' or '/packages/' in request.path %}on{% endif %}">
        <svg viewBox="0 0 24 24" class="nav-ic" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        <span>Packages</span>
      </a>
      <a href="{% url 'admin_list' 'hotels' %}" class="sidebar-item {% if key == 'hotels' or '/hotels/' in request.path %}on{% endif %}">
        <svg viewBox="0 0 24 24" class="nav-ic" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v14M21 7v14M3 13h18M3 7h18a2 2 0 0 1 2 2v4H1V9a2 2 0 0 1 2-2z"></path></svg>
        <span>Hotels</span>
      </a>
      <a href="{% url 'admin_list' 'activities' %}" class="sidebar-item {% if key == 'activities' or '/activities/' in request.path %}on{% endif %}">
        <svg viewBox="0 0 24 24" class="nav-ic" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="4" r="2"></circle><path d="M15 8h-6l-2 5 3 2v6h2v-5l2-2 1-3 2-1"></path></svg>
        <span>Activities</span>
      </a>
      <a href="{% url 'admin_bookings' %}" class="sidebar-item {% if request.resolver_match.url_name == 'admin_bookings' %}on{% endif %}">
        <svg viewBox="0 0 24 24" class="nav-ic" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>Bookings</span>
      </a>
      <a href="{% url 'admin_customers' %}" class="sidebar-item {% if request.resolver_match.url_name == 'admin_customers' %}on{% endif %}">
        <svg viewBox="0 0 24 24" class="nav-ic" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>Customers</span>
      </a>
      <a href="{% url 'admin_reports' %}" class="sidebar-item {% if request.resolver_match.url_name == 'admin_reports' %}on{% endif %}">
        <svg viewBox="0 0 24 24" class="nav-ic" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span>Reports</span>
      </a>
    </nav>
    <div class="sidebar-art-wrap">
      <img src="{% static 'img/sidebar_mountains.png' %}" alt="" class="sidebar-art-img">
    </div>
  </aside>
  <section class="admin-main-content">
    {% block admin %}{% endblock %}
  </section>
</div>
{% endblock %}
