{% extends "manage/base.html" %}
{% block admin %}
<div class="row sp page-head"><h2>{{ title }}</h2><a class="btn" href="{% url 'admin_add' key %}">Add new</a></div>
<div class="tablewrap"><table>{% for o in objects %}<tr><td><b>{{ o }}</b></td><td style="text-align:right;white-space:nowrap"><a class="btn ghost small" href="{% url 'admin_edit' key o.pk %}">Edit</a> <a class="btn danger small" href="{% url 'admin_delete' key o.pk %}">Delete</a></td></tr>{% empty %}<tr><td class="muted">Nothing here yet.</td></tr>{% endfor %}</table></div>
{% endblock %}
