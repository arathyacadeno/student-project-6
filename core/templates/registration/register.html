{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:480px;margin:30px auto"><h2>Create your account</h2>
<form method="post">{% csrf_token %}{% for f in form %}<div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{{ f.errors }}{% if f.help_text %}<span class="help">{{ f.help_text|safe }}</span>{% endif %}</div>{% endfor %}
<button type="submit">Sign up</button></form></div>
{% endblock %}
