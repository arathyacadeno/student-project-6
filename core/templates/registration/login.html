{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:440px;margin:30px auto"><h2>Log in</h2>
<form method="post">{% csrf_token %}{% if form.errors %}<p class="errorlist">Wrong username or password. Check both and try again.</p>{% endif %}
<div class="field"><label for="id_username">Username</label>{{ form.username }}</div>
<div class="field"><label for="id_password">Password</label>{{ form.password }}</div>
<input type="hidden" name="next" value="{{ next }}"><button type="submit">Log in</button></form>
<p class="muted small">New here? <a href="{% url 'register' %}">Create an account</a></p></div>
{% endblock %}
